<svg
  width="1200"
  height="1200"
  viewBox="0 0 1200 1200"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- ============================================ -->
    <!-- MAIN AETHER GRADIENT                         -->
    <!-- ============================================ -->

    <linearGradient
      id="aetherGradient"
      x1="250"
      y1="300"
      x2="950"
      y2="850"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#21E6FF"/>
      <stop offset="32%" stop-color="#1688FF"/>
      <stop offset="62%" stop-color="#345CFF"/>
      <stop offset="100%" stop-color="#8B3DFF"/>
    </linearGradient>

    <!-- ============================================ -->
    <!-- SECONDARY RIBBON GRADIENT                    -->
    <!-- ============================================ -->

    <linearGradient
      id="ribbonGradient"
      x1="350"
      y1="700"
      x2="850"
      y2="700"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#16DFFF"/>
      <stop offset="48%" stop-color="#1479FF"/>
      <stop offset="100%" stop-color="#7042FF"/>
    </linearGradient>

    <!-- ============================================ -->
    <!-- FLOW WORDMARK GRADIENT                       -->
    <!-- ============================================ -->

    <linearGradient
      id="flowGradient"
      x1="650"
      y1="950"
      x2="1060"
      y2="950"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#13DFFF"/>
      <stop offset="48%" stop-color="#2788FF"/>
      <stop offset="100%" stop-color="#A04CFF"/>
    </linearGradient>

    <!-- ============================================ -->
    <!-- NODE GRADIENT                                -->
    <!-- ============================================ -->

    <linearGradient
      id="nodeGradient"
      x1="300"
      y1="480"
      x2="950"
      y2="700"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#25E8FF"/>
      <stop offset="55%" stop-color="#438CFF"/>
      <stop offset="100%" stop-color="#A85CFF"/>
    </linearGradient>

    <!-- ============================================ -->
    <!-- SOFT GLOW                                    -->
    <!-- ============================================ -->

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="10"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ============================================ -->
    <!-- SMALLER GLOW                                 -->
    <!-- ============================================ -->

    <filter
      id="nodeGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ===================================================== -->
  <!-- AETHERFLOW SYMBOL                                     -->
  <!-- ===================================================== -->

  <g id="mark">

   

    <path
      d="
        M 255 735

        C 295 690
          325 620
          365 545

        L 485 315

        C 515 258
          565 225
          625 225

        C 690 225
          730 258
          760 315

        L 955 735

        L 825 735

        L 680 420

        C 665 388
          645 370
          620 370

        C 595 370
          575 390
          558 425

        L 425 735

        C 390 770
          315 775
          255 735

        Z
      "
      fill="url(#aetherGradient)"
      filter="url(#glow)"
    />


    <path
      d="
        M 425 735

        L 558 425

        C 575 390
          595 370
          620 370

        C 645 370
          665 388
          680 420

        L 825 735

        L 760 735

        L 650 495

        C 638 468
          625 455
          610 455

        C 595 455
          583 468
          570 495

        L 465 735

        Z
      "
      fill="#173CBA"
      opacity="0.42"
    />


    <path
      d="
        M 255 735

        C 340 710
          420 625
          500 570

        C 560 528
          620 525
          675 555

        C 720 580
          760 625
          805 675

        L 850 735

        L 730 735

        C 695 695
          660 650
          615 635

        C 570 620
          525 635
          480 670

        C 420 715
          360 755
          300 760

        C 280 760
          265 750
          255 735

        Z
      "
      fill="url(#ribbonGradient)"
    />


    <path
      d="
        M 275 720
        C 350 690
          420 610
          495 560
        C 550 522
          610 520
          665 550
      "
      stroke="#55F2FF"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.55"
    />

  </g>


  <g
    id="workflow"
    filter="url(#nodeGlow)"
  >

    <!-- Main workflow line -->

    <path
      d="
        M 345 525
        C 420 525
          470 525
          535 525

        C 580 525
          605 510
          645 510

        C 700 510
          735 545
          770 585

        C 805 625
          850 650
          900 650
      "
      stroke="url(#nodeGradient)"
      stroke-width="12"
      stroke-linecap="round"
      fill="none"
    />


    <circle
      cx="345"
      cy="525"
      r="44"
      fill="#0D6FFF"
      stroke="#8CF8FF"
      stroke-width="8"
    />

    <circle
      cx="345"
      cy="525"
      r="18"
      fill="#D8FCFF"
    />

   
    <circle
      cx="645"
      cy="510"
      r="48"
      fill="#1A6FFF"
      stroke="#E7FDFF"
      stroke-width="9"
    />

    <circle
      cx="645"
      cy="510"
      r="19"
      fill="#E9FDFF"
    />


    <circle
      cx="900"
      cy="650"
      r="46"
      fill="#5825D9"
      stroke="#F0D5FF"
      stroke-width="9"
    />

    <circle
      cx="900"
      cy="650"
      r="18"
      fill="#F7E9FF"
    />

  </g>


  <!-- ===================================================== -->
  <!-- WORDMARK                                              -->
  <!-- ===================================================== -->

  <g id="wordmark">

    <!-- Aether -->

    <text
      x="250"
      y="900"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="122"
      font-weight="700"
      letter-spacing="-5"
      fill="url(#flowGradient)"
    >
      Aether
    </text>

    <!-- Flow -->

    <text
      x="620"
      y="900"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="122"
      font-weight="700"
      letter-spacing="-5"
      fill="url(#flowGradient)"
    >
      Flow
    </text>

  </g>



  <text
    x="600"
    y="975"
    text-anchor="middle"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="500"
    letter-spacing="9"
    fill="#FFFFFF"
  >
    BUILD  •  ORCHESTRATE  •  INTELLIGENCE
  </text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="aether-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="aether-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glow (subtle) -->
  <circle cx="24" cy="24" r="20" fill="url(#aether-glow)" opacity="0.12" filter="url(#glow-blur)" />

  <!-- Outer Rounded Diamond Shield -->
  <rect x="6" y="6" width="36" height="36" rx="10" transform="rotate(0 24 24)" fill="#0B1120" stroke="url(#aether-primary)" stroke-width="1.75" stroke-opacity="0.4" />

  <!-- The AetherFlow Geometric "A" Nexus -->
  <!-- Left Ascent Arc -->
  <path d="M14 34L22.2 14.8C22.9 13.2 25.1 13.2 25.8 14.8L34 34" stroke="url(#aether-primary)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flow Wave Bridge (Connecting node loops) -->
  <path d="M17.5 26.5C21 23.5 27 23.5 30.5 26.5" stroke="url(#aether-primary)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Dynamic Orbiting Core Node (The "Soul" / Guardrail Core) -->
  <circle cx="24" cy="22" r="3.2" fill="#00F2FE" filter="url(#glow-blur)" />
  <circle cx="24" cy="22" r="1.6" fill="#FFFFFF" />

  <!-- Terminal Satellite Pulses -->
  <circle cx="14" cy="34" r="2.2" fill="#22D3EE" />
  <circle cx="34" cy="34" r="2.2" fill="#A855F7" />
  <circle cx="24" cy="14" r="2" fill="#6366F1" />
</svg>
